<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>실내지도 정밀 보정 도구 | G-map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0a0f28; font-family:'Outfit',sans-serif; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
#map { flex:1; min-height:0; }
#ctrl {
  position:absolute; top:12px; right:12px; z-index:1000;
  background:rgba(10,15,40,0.92); backdrop-filter:blur(12px);
  border:1px solid rgba(129,140,248,0.3); border-radius:14px;
  padding:14px; width:290px; max-height:calc(100vh - 24px); overflow-y:auto;
}
.ctrl-title { color:#818cf8; font-size:13px; font-weight:800; margin-bottom:10px; letter-spacing:0.3px; }
.row { margin-bottom:8px; }
.row label { color:#94a3b8; font-size:10px; font-weight:700; display:block; margin-bottom:3px; }
.row input[type=range] { width:100%; accent-color:#818cf8; cursor:pointer; }
.row .val { color:#e2e8f0; font-size:11px; font-weight:700; float:right; }
.sep { border:none; border-top:1px dashed rgba(255,255,255,0.1); margin:10px 0; }
.btn {
  display:block; width:100%; padding:9px; border-radius:8px; border:none;
  font-family:'Outfit',sans-serif; font-size:12px; font-weight:800; cursor:pointer;
  margin-bottom:6px; transition:all 0.2s;
}
.btn-primary { background:linear-gradient(135deg,#6366f1,#818cf8); color:white; }
.btn-primary:hover { opacity:0.9; }
.btn-copy { background:rgba(16,185,129,0.2); color:#34d399; border:1px solid rgba(16,185,129,0.4); }
.btn-copy:hover { background:rgba(16,185,129,0.3); }
.code-out {
  background:rgba(0,0,0,0.4); border:1px solid rgba(255,255,255,0.1);
  border-radius:6px; padding:8px; font-size:10px; color:#94a3b8;
  font-family:monospace; line-height:1.6; word-break:break-all;
  margin-top:6px; max-height:100px; overflow-y:auto;
}
#header {
  position:absolute; top:12px; left:12px; z-index:1000;
  background:rgba(10,15,40,0.88); backdrop-filter:blur(12px);
  border:1px solid rgba(14,165,233,0.3); border-radius:12px; padding:10px 14px;
}
#header h1 { color:white; font-size:13px; font-weight:800; }
#header p { color:#64748b; font-size:10px; margin-top:2px; }
#status-bar {
  position:absolute; bottom:12px; left:50%; transform:translateX(-50%);
  background:rgba(10,15,40,0.85); border:1px solid rgba(255,255,255,0.1);
  border-radius:20px; padding:5px 14px; color:#94a3b8; font-size:10px; z-index:1000;
}
</style>
</head>
<body>

<div id="map"></div>

<div id="header">
  <h1>🔬 실내지도 정밀 보정 도구</h1>
  <p>슬라이더로 조절 → 코드 복사 → map-techno-b1.js 에 붙여넣기</p>
</div>

<div id="ctrl">
  <div class="ctrl-title">📐 실내지도 변환 파라미터</div>

  <div class="row">
    <label>중심 위도 (centerLat) <span class="val" id="v-lat">36.146361</span></label>
    <input type="range" id="s-lat" min="36.130" max="36.165" step="0.000001" value="36.146361">
  </div>
  <div class="row">
    <label>중심 경도 (centerLon) <span class="val" id="v-lon">128.394600</span></label>
    <input type="range" id="s-lon" min="128.370" max="128.420" step="0.000001" value="128.394600">
  </div>
  <div class="row">
    <label>스케일 경도 (scaleLon) <span class="val" id="v-slon">0.00000115</span></label>
    <input type="range" id="s-slon" min="0.0000005" max="0.000003" step="0.0000001" value="0.00000115">
  </div>
  <div class="row">
    <label>스케일 위도 (scaleLat) <span class="val" id="v-slat">0.00000095</span></label>
    <input type="range" id="s-slat" min="0.0000005" max="0.000003" step="0.0000001" value="0.00000095">
  </div>
  <div class="row">
    <label>회전각 (rotation°) <span class="val" id="v-rot">0</span></label>
    <input type="range" id="s-rot" min="-30" max="30" step="0.1" value="0">
  </div>
  <div class="row">
    <label>투명도 (opacity) <span class="val" id="v-opa">0.85</span></label>
    <input type="range" id="s-opa" min="0" max="1" step="0.05" value="0.85">
  </div>

  <hr class="sep">

  <div class="ctrl-title">🛰️ 정사영상 배경</div>
  <div class="row">
    <label>정사영상 표시 <span class="val" id="v-ortho">ON</span></label>
    <input type="range" id="s-ortho" min="0" max="1" step="1" value="1">
  </div>
  <div class="row">
    <label>정사영상 투명도 <span class="val" id="v-oopa">0.8</span></label>
    <input type="range" id="s-oopa" min="0" max="1" step="0.05" value="0.8">
  </div>

  <hr class="sep">

  <button class="btn btn-primary" onclick="renderFloor()">🔄 즉시 적용</button>
  <button class="btn btn-copy" onclick="copyCode()">📋 설정값 복사</button>
  <div class="code-out" id="code-out">// 여기에 복사할 코드가 표시됩니다</div>
</div>

<div id="status-bar">맵 로딩 중...</div>

<script>
// ── 지도 초기화 (금오공대 중심) ──
const map = L.map('map', {
  center: [36.1468, 128.3946],
  zoom: 17,
  maxZoom: 18
});

// 기본 OSM 레이어
const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap',
  opacity: 0.4
}).addTo(map);

// ── EPSG:4326 TMS 정사영상 레이어 ──
function wmTile2geo4326Tms(z, wx, wy) {
  const n = Math.pow(2, z);
  const lon = (wx + 0.5) / n * 360.0 - 180.0;
  const latRad = Math.atan(Math.sinh(Math.PI * (1 - 2 * (wy + 0.5) / n)));
  const lat = latRad * 180.0 / Math.PI;
  const xTiles = Math.pow(2, z + 1);
  const yTiles = Math.pow(2, z);
  const tx = Math.floor((lon + 180.0) / 360.0 * xTiles);
  const ty = Math.floor((lat + 90.0) / 180.0 * yTiles);
  return { z, x: tx, y: ty };
}

const Ortho4326Layer = L.TileLayer.extend({
  getTileUrl(coords) {
    const t = wmTile2geo4326Tms(coords.z, coords.x, coords.y);
    return `/gis/8765/${t.z}/${t.x}/${t.y}.jpg`;
  }
});

let orthoLayer = new Ortho4326Layer(null, {
  minZoom: 13, maxZoom: 17, opacity: 0.8,
  errorTileUrl: 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7',
  crossOrigin: true
}).addTo(map);

// ── 실내지도 레이어 ──
let floorGroup = L.layerGroup().addTo(map);

// 파라미터
let cfg = {
  centerLat: 36.146361, centerLon: 128.394600,
  scaleLon: 0.00000115, scaleLat: 0.00000095,
  rotation: 0, opacity: 0.85
};

const CX = 445, CY = 395;

function pxToLatLng(x, y) {
  const rad = cfg.rotation * Math.PI / 180;
  let dx = (x - CX) * cfg.scaleLon;
  let dy = (y - CY) * cfg.scaleLat;
  const rx =  dx * Math.cos(rad) + dy * Math.sin(rad);
  const ry = -dx * Math.sin(rad) + dy * Math.cos(rad);
  return [cfg.centerLat - ry, cfg.centerLon + rx];
}

function rectPoly(x, y, w, h) {
  return [pxToLatLng(x,y), pxToLatLng(x+w,y), pxToLatLng(x+w,y+h), pxToLatLng(x,y+h)];
}

// 방 데이터 (techno B1F)
const rooms = [
  {x:223,y:21,w:90,h:108,label:"B108",name:"지하 대형 보강고"},
  {x:353,y:23,w:75,h:105,label:"B107",name:"지하 연구실"},
  {x:428,y:21,w:85,h:109,label:"B106",name:"중앙 유틸리티실"},
  {x:548,y:22,w:209,h:149,label:"B105",name:"지하 대강의실"},
  {x:583,y:171,w:174,h:55,label:"B104",name:"기계 공조실"},
  {x:223,y:166,w:80,h:130,label:"B113",name:"지하 문서 아카이브"},
  {x:303,y:166,w:45,h:73,label:"B112",name:"소형 자재고"},
  {x:348,y:166,w:75,h:73,label:"B111",name:"서버 테스팅 룸"},
  {x:133,y:409,w:45,h:40,label:"B118",name:"동아리방 A"},
  {x:133,y:449,w:45,h:40,label:"B119",name:"동아리방 B"},
  {x:133,y:489,w:45,h:40,label:"B120",name:"동아리방 C"},
  {x:133,y:529,w:45,h:40,label:"B121",name:"밴드 연습실"},
  {x:223,y:409,w:75,h:45,label:"B132",name:"연구자 휴게실"},
  {x:223,y:455,w:75,h:75,label:"B131",name:"지하 로봇 작업장"},
];
const corridors = [
  {x:128,y:123,w:416,h:46},
  {x:168,y:164,w:64,h:571},
];
const outerContour = "M130,20 L760,20 L758,228 L704,228 L702,266 L643,266 L643,325 L597,325 L597,317 L521,317 L521,408 L300,410 L300,770 L130,770 Z";

function parseSvgPath(str) {
  const coords = [];
  const matches = str.match(/([ML])[\s,]*([\d.-]+)[\s,]*([\d.-]+)/gi) || [];
  matches.forEach(m => {
    const parts = m.replace(/[ML]/i,'').trim().split(/[\s,]+/);
    if (parts.length >= 2) coords.push(pxToLatLng(parseFloat(parts[0]), parseFloat(parts[1])));
  });
  return coords;
}

function renderFloor() {
  floorGroup.clearLayers();
  const op = cfg.opacity;

  // 외곽선
  const outerCoords = parseSvgPath(outerContour);
  if (outerCoords.length > 0) {
    L.polygon(outerCoords, {
      color:'#6366f1', weight:3, fillColor:'#312e81',
      fillOpacity:0.35*op, dashArray:'4,4'
    }).addTo(floorGroup);
  }

  // 복도
  corridors.forEach(c => {
    L.polygon(rectPoly(c.x,c.y,c.w,c.h), {
      color:'#475569', weight:1, fillColor:'#64748b', fillOpacity:0.25*op
    }).addTo(floorGroup);
  });

  // 방
  rooms.forEach(r => {
    const poly = L.polygon(rectPoly(r.x,r.y,r.w,r.h), {
      color:'#3b82f6', weight:1.5, fillColor:'#1e3a8a', fillOpacity:0.65*op
    });
    poly.bindTooltip(`<b>${r.label}</b><br>${r.name}`, {permanent:false});
    floorGroup.addLayer(poly);

    const center = pxToLatLng(r.x+r.w/2, r.y+r.h/2);
    L.marker(center, {
      icon: L.divIcon({
        className:'',
        html:`<div style="font-size:9px;font-weight:800;color:#fff;text-shadow:0 0 3px #000;white-space:nowrap;text-align:center;">${r.label}</div>`,
        iconSize:[40,14], iconAnchor:[20,7]
      })
    }).addTo(floorGroup);
  });

  document.getElementById('status-bar').textContent =
    `✅ 렌더링 완료 | center=[${cfg.centerLat.toFixed(6)}, ${cfg.centerLon.toFixed(6)}] scale=[${cfg.scaleLon.toFixed(8)}, ${cfg.scaleLat.toFixed(8)}] rot=${cfg.rotation}°`;
}

function copyCode() {
  const code = `// ── 실내지도 보정 완료 설정값 ──
// 이 값을 gumap_developer_config에 저장하거나
// map-techno-b1.js의 getDevConfig() 기본값으로 교체하세요

centerLat: ${cfg.centerLat},
centerLon: ${cfg.centerLon},
scaleLon:  ${cfg.scaleLon},
scaleLat:  ${cfg.scaleLat},
rotation:  ${cfg.rotation}

// localStorage 즉시 적용 (브라우저 콘솔에 붙여넣기):
localStorage.setItem('gumap_developer_config', JSON.stringify({
  INDOOR_OPACITY: '${cfg.opacity}',
  INDOOR_CENTER_LAT: '${cfg.centerLat}',
  INDOOR_CENTER_LON: '${cfg.centerLon}',
  INDOOR_SCALE_LON: '${cfg.scaleLon}',
  INDOOR_SCALE_LAT: '${cfg.scaleLat}',
  INDOOR_ROTATION: '${cfg.rotation}'
}));`;
  document.getElementById('code-out').textContent = code;
  if (navigator.clipboard) navigator.clipboard.writeText(code).then(() => {
    document.getElementById('code-out').style.borderColor = '#34d399';
    setTimeout(() => document.getElementById('code-out').style.borderColor = '', 1500);
  });
}

// 슬라이더 바인딩
function bindSlider(id, valId, cfgKey, fmt) {
  const sl = document.getElementById(id);
  const vl = document.getElementById(valId);
  sl.addEventListener('input', () => {
    const v = parseFloat(sl.value);
    cfg[cfgKey] = v;
    vl.textContent = fmt ? v.toFixed(8) : v;
    renderFloor();
  });
}

bindSlider('s-lat',  'v-lat',  'centerLat', false);
bindSlider('s-lon',  'v-lon',  'centerLon', false);
bindSlider('s-slon', 'v-slon', 'scaleLon',  true);
bindSlider('s-slat', 'v-slat', 'scaleLat',  true);
bindSlider('s-rot',  'v-rot',  'rotation',  false);
bindSlider('s-opa',  'v-opa',  'opacity',   false);

document.getElementById('s-oopa').addEventListener('input', e => {
  orthoLayer.setOpacity(parseFloat(e.target.value));
  document.getElementById('v-oopa').textContent = e.target.value;
});
document.getElementById('s-ortho').addEventListener('input', e => {
  if (parseInt(e.target.value) === 1) {
    orthoLayer.addTo(map);
    document.getElementById('v-ortho').textContent = 'ON';
  } else {
    map.removeLayer(orthoLayer);
    document.getElementById('v-ortho').textContent = 'OFF';
  }
});

// 초기 렌더링
renderFloor();
</script>
</body>
</html>
