<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>금오공대 3D 캠퍼스 뷰어 | G-map</title>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.110/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.110/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- 테크노관 층별 도형. 2D 실내지도와 같은 번들을 그대로 쓴다. -->
    <script src="GUMAP-프론트/js/map/map-techno-imdf-data.js?v=7d00a266"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #060918; font-family: 'Outfit', sans-serif; overflow: hidden; }
        #cesiumContainer { width: 100%; height: 100%; }
        #header {
            position: absolute; top: 0; left: 0; right: 0; z-index: 200;
            background: linear-gradient(to bottom, rgba(6,9,24,0.95), rgba(6,9,24,0));
            padding: 14px 18px 30px;
            pointer-events: none;
        }
        #header .title { color: white; font-size: 15px; font-weight: 800; }
        #header .title span { color: #818cf8; }
        #header .subtitle { color: #64748b; font-size: 11px; margin-top: 2px; }
        #building-panel {
            position: absolute; top: 80px; left: 14px; z-index: 200;
            background: rgba(10,15,40,0.88); backdrop-filter: blur(12px);
            border: 1px solid rgba(129,140,248,0.25); border-radius: 12px; padding: 12px; width: 200px;
        }
        #building-panel .panel-title { color: #818cf8; font-size: 11px; font-weight: 800; margin-bottom: 8px; text-transform: uppercase; }
        .bldg-btn {
            display: block; width: 100%; text-align: left; padding: 8px 10px; margin-bottom: 4px;
            border-radius: 7px; border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.04); color: #94a3b8;
            font-family: 'Outfit', sans-serif; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s;
        }
        .bldg-btn:hover { background: rgba(129,140,248,0.15); color: white; border-color: rgba(129,140,248,0.4); }
        .bldg-btn.active { background: rgba(129,140,248,0.2); color: #a5b4fc; border-color: #818cf8; }
        .floor-btn {
            padding: 4px 8px; font-size: 10px; font-weight: 700; cursor: pointer;
            background: rgba(129,140,248,0.12); color: #c7d2fe;
            border: 1px solid rgba(129,140,248,0.3); border-radius: 6px;
        }
        .floor-btn:hover { background: rgba(129,140,248,0.28); }
        .floor-btn.active { background: #6366f1; color: #fff; border-color: #818cf8; }
        #status-panel {
            position: absolute; top: 80px; right: 14px; z-index: 200;
            background: rgba(10,15,40,0.88); backdrop-filter: blur(12px);
            border: 1px solid rgba(99,102,241,0.25); border-radius: 12px; padding: 12px 14px; min-width: 200px;
        }
        #status-panel .s-label { color: #64748b; font-size: 10px; font-weight: 600; margin-bottom: 2px; }
        #status-panel .s-value { color: #e2e8f0; font-size: 12px; font-weight: 700; margin-bottom: 8px; }
        #load-status { font-size: 12px; font-weight: 700; color: #fbbf24; }
        #load-status.ok { color: #34d399; }
        #load-status.err { color: #f87171; }
        #bottom-hint {
            position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
            color: rgba(148,163,184,0.7); font-size: 10px; font-weight: 500;
            background: rgba(6,9,24,0.7); padding: 6px 14px; border-radius: 20px; white-space: nowrap; z-index: 200;
        }
        #close-btn {
            position: absolute; top: 14px; right: 14px; z-index: 300;
            background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.4);
            color: #f87171; font-family: 'Outfit', sans-serif; font-size: 11px; font-weight: 700;
            padding: 6px 12px; border-radius: 6px; cursor: pointer;
        }
        #close-btn:hover { background: rgba(239,68,68,0.3); }
    </style>
</head>
<body>

<div id="header">
    <div class="title">🏛️ 금오공과대학교 <span>3D 캠퍼스</span></div>
    <div class="subtitle">IACF · 도서관(LIB) · 학생회관(StC) 실측 3D Tiles &nbsp;|&nbsp; 테크노관 도면 입체화</div>
</div>

<button id="close-btn" onclick="window.close()">✕ 닫기</button>

<div id="building-panel">
    <div class="panel-title">🏢 건물 선택</div>
    <button class="bldg-btn" onclick="flyToBuilding('all')">🌏 전체 보기</button>
    <button class="bldg-btn" id="btn-iacf" onclick="flyToBuilding('iacf')">🔬 IACF 공학관</button>
    <button class="bldg-btn" id="btn-lib"  onclick="flyToBuilding('lib')">📚 도서관 (LIB)</button>
    <button class="bldg-btn" id="btn-stc"  onclick="flyToBuilding('stc')">🎓 학생회관 (StC)</button>
    <button class="bldg-btn" id="btn-techno" onclick="flyToBuilding('techno')">🏫 테크노관 (실내)</button>

    <hr style="border-color:rgba(255,255,255,0.08); margin:8px 0;">
    <div class="panel-title" style="margin-bottom:6px;">🏢 테크노관 층</div>
    <div id="floor-buttons" style="display:flex; flex-wrap:wrap; gap:4px; margin-bottom:8px;"></div>
    <label style="display:flex; align-items:center; gap:6px; color:#94a3b8; font-size:10px; cursor:pointer;">
        <input type="checkbox" id="explode-toggle" checked> 층 사이 띄워 보기
    </label>

    <hr style="border-color:rgba(255,255,255,0.08); margin:8px 0;">
    <div style="color:#64748b; font-size:10px; line-height:1.6;">
        💡 드래그: 회전<br>휠: 줌인/줌아웃<br>우클릭: 기울기
    </div>
</div>

<div id="status-panel">
    <div class="s-label">로드 상태</div>
    <div id="load-status">⏳ 로딩 중...</div>
    <div class="s-label" style="margin-top:8px;">서버</div>
    <div class="s-value" style="color:#818cf8; font-size:10px;">http://localhost:8766</div>
    <div class="s-label" style="margin-top:4px;">서버 실행 방법</div>
    <div class="s-value" style="font-size:9px; color:#64748b; line-height:1.4;">start-gis-servers.bat<br>더블클릭으로 실행</div>
</div>

<div id="cesiumContainer"></div>
<div id="bottom-hint">🖱️ 왼쪽 클릭 드래그: 회전 &nbsp;|&nbsp; 우클릭 드래그: 기울기 &nbsp;|&nbsp; 스크롤: 줌</div>

<script>
(async function() {
    // ── Ion 없이 완전 로컬 모드 ──
    // Cesium Ion 연결을 완전히 차단하여 401 오류 방지
    Cesium.Ion.defaultAccessToken = undefined;

    const viewer = new Cesium.Viewer('cesiumContainer', {
        // Ion 기반 기능 모두 비활성화
        imageryProvider: new Cesium.SingleTileImageryProvider({
            url: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==',
            rectangle: Cesium.Rectangle.fromDegrees(-180, -90, 180, 90)
        }),
        terrainProvider: new Cesium.EllipsoidTerrainProvider(),
        baseLayerPicker: false,
        timeline: false,
        animation: false,
        geocoder: false,
        homeButton: false,
        sceneModePicker: false,
        navigationHelpButton: false,
        fullscreenButton: false,
        creditContainer: document.createElement('div'),
        requestRenderMode: false
    });

    // 다크 배경
    viewer.scene.backgroundColor = Cesium.Color.fromCssColorString('#0a0f28');
    viewer.scene.globe.show = false;   // 지구본 숨기기 (Ion 없이도 작동)
    viewer.scene.skyBox.show = false;
    viewer.scene.sun.show = false;
    viewer.scene.moon.show = false;
    viewer.scene.skyAtmosphere.show = false;

    const loadStatus = document.getElementById('load-status');

    // ── 3D Tiles 로드 (신 API 방식: fromUrl) ──
    let tileset;
    let technoReady = false;
    try {
        tileset = await Cesium.Cesium3DTileset.fromUrl(
            'http://localhost:8766/tileset.json',
            {
                maximumScreenSpaceError: 2,
                maximumNumberOfLoadedTiles: 500,
                skipLevelOfDetail: true,
                baseScreenSpaceError: 1024,
                skipScreenSpaceErrorFactor: 16
            }
        );
        viewer.scene.primitives.add(tileset);
        viewer.zoomTo(tileset);
        technoReady = true;
        loadStatus.textContent = '✅ 3D 모델 로드 완료';
        loadStatus.className = 'ok';
    } catch (err) {
        console.error('3D Tiles 로드 실패:', err);
        loadStatus.innerHTML = '❌ 연결 실패<br><span style="color:#94a3b8;font-size:9px;">start-gis-servers.bat 실행 후 새로고침</span>';
        loadStatus.className = 'err';
        // 실패해도 카메라는 금오공대로 이동
        viewer.camera.flyTo({
            destination: Cesium.Cartesian3.fromDegrees(128.3946, 36.1468, 400),
            orientation: { heading: 0, pitch: Cesium.Math.toRadians(-45), roll: 0 }
        });
    }

    // ── 건물별 카메라 위치 ──
    const buildingCoords = {
        all:  { lon: 128.39460, lat: 36.14680, alt: 350, head: 0,   pitch: -45 },
        iacf: { lon: 128.39475, lat: 36.14720, alt: 180, head: -30, pitch: -35 },
        lib:  { lon: 128.39450, lat: 36.14640, alt: 150, head: 10,  pitch: -30 },
        stc:  { lon: 128.39435, lat: 36.14590, alt: 140, head: 20,  pitch: -30 },
        techno: { lon: 128.39430, lat: 36.14600, alt: 200, head: 25, pitch: -32 }
    };

    window.flyToBuilding = function(key) {
        // 테크노관은 고정 좌표 대신 실제 도형 범위에 맞춰 잡는다. 좌표를 손으로
        // 적었더니 건물이 화면 밖으로 밀려났다. 층을 하나만 켜 두면 그 층에 맞춘다.
        if (key === 'techno') {
            const shown = [];
            Object.keys(technoFloors).forEach(function (floor) {
                technoFloors[floor].forEach(function (entity) {
                    if (entity.show !== false) shown.push(entity);
                });
            });
            if (shown.length) {
                viewer.flyTo(shown, {
                    duration: 1.8,
                    offset: new Cesium.HeadingPitchRange(
                        Cesium.Math.toRadians(25), Cesium.Math.toRadians(-38), 260)
                });
                document.querySelectorAll('.bldg-btn').forEach(b => b.classList.remove('active'));
                const technoBtn = document.getElementById('btn-techno');
                if (technoBtn) technoBtn.classList.add('active');
                return;
            }
        }
        const c = buildingCoords[key];
        if (!c) return;
        viewer.camera.flyTo({
            destination: Cesium.Cartesian3.fromDegrees(c.lon, c.lat, c.alt),
            orientation: { heading: Cesium.Math.toRadians(c.head), pitch: Cesium.Math.toRadians(c.pitch), roll: 0 },
            duration: 1.8
        });
        document.querySelectorAll('.bldg-btn').forEach(b => b.classList.remove('active'));
        const btn = document.getElementById('btn-' + key);
        if (btn) btn.classList.add('active');
    };


    /* ─────────────── 테크노관 도면 입체화 ───────────────
     *
     * 테크노관은 실측 3D Tiles 에 없다. 촬영한 것은 IACF·도서관·학생회관
     * 세 동뿐이다. 대신 층별 도면이 전부 있으니 그걸 쌓아 올린다.
     *
     * 높이 기준은 3D Tiles 의 boundingVolume 최저점(50.7m)이다. 그래야
     * 옆 건물들과 같은 지면 위에 선다. 층고는 실내 길찾기가 쓰는 값과
     * 같은 4m 다 (fp/route.py FLOOR_HEIGHT_M).
     */
    const GROUND_M = 50.7;          // 3D Tiles 지면 고도
    const FLOOR_H = 4.0;            // 층고 (실내 길찾기와 같은 값)
    const SLAB_H = 3.2;             // 벽 높이. 층 사이를 조금 띄워 켜켜이 보이게
    const EXPLODE_H = 3.0;          // "띄워 보기" 일 때 층마다 더 벌리는 높이

    // 지면부터 세는 층 번호. B1F 가 -1, 1F 가 0 이다.
    const FLOOR_INDEX = { 'B1F': -1, '1F': 0, '2F': 1, '3F': 2, '4F': 3, '5F': 4, '6F': 5 };

    // 2D 실내지도와 같은 색이라야 같은 건물로 읽힌다.
    const CAT_COLOR = {
        laboratory: '#10b981', classroom: '#3b82f6', office:   '#8b5cf6',
        restroom:   '#06b6d4', stairs:    '#f59e0b', elevator: '#a855f7',
        walkway:    '#94a3b8', utility:   '#f43f5e', breakroom:'#84cc16',
        library:    '#eab308', atrium:    '#14b8a6'
    };

    const technoFloors = {};        // 층 -> Cesium Entity 배열
    let explode = true;
    let shownFloor = 'all';

    function floorBase(floor) {
        const index = FLOOR_INDEX[floor];
        if (index === undefined) return null;
        return GROUND_M + index * FLOOR_H + (explode ? index * EXPLODE_H : 0);
    }

    function buildTechno() {
        const bundle = window.IMDF_TECHNO_DATA;
        if (!bundle || !bundle.units) {
            document.getElementById('floor-buttons').innerHTML =
                '<span style="color:#64748b;font-size:10px;">도면 번들 없음</span>';
            return;
        }

        // level_id -> 층 이름
        const levelName = {};
        bundle.levels.features.forEach(function (level) {
            levelName[level.id] = level.properties.short_name['ko-KR'];
        });

        bundle.units.features.forEach(function (unit) {
            const floor = levelName[unit.properties.level_id];
            const base = floorBase(floor);
            if (base === null) return;
            const ring = unit.geometry.coordinates[0];
            if (!ring || ring.length < 4) return;

            const category = unit.properties.category || 'other';
            const label = (unit.properties.label || {})['ko-KR'] || '';
            const name = (unit.properties.name || {})['ko-KR'] || label;
            const color = CAT_COLOR[category] || '#64748b';
            // 복도는 바닥판처럼 낮게 깔아 둔다. 벽처럼 세우면 안이 안 보인다.
            const isFloorPlate = category === 'walkway';

            const positions = [];
            ring.forEach(function (point) { positions.push(point[0], point[1]); });

            const entity = viewer.entities.add({
                name: (label ? label + ' · ' : '') + name,
                description:
                    '<div style="font-family:sans-serif">' +
                    '<b>' + name + '</b><br>' +
                    '<span style="color:#666">' + floor + ' · ' + category + '</span></div>',
                polygon: {
                    hierarchy: Cesium.Cartesian3.fromDegreesArray(positions),
                    height: base,
                    extrudedHeight: base + (isFloorPlate ? 0.25 : SLAB_H),
                    material: Cesium.Color.fromCssColorString(color)
                        .withAlpha(isFloorPlate ? 0.55 : 0.78),
                    outline: true,
                    outlineColor: Cesium.Color.fromCssColorString(color).brighten(0.5, new Cesium.Color()),
                    outlineWidth: 1
                }
            });
            entity._technoFloor = floor;
            (technoFloors[floor] = technoFloors[floor] || []).push(entity);
        });

        renderFloorButtons();
        applyFloorFilter();
    }

    function renderFloorButtons() {
        const order = ['B1F', '1F', '2F', '3F', '4F', '5F', '6F'];
        const host = document.getElementById('floor-buttons');
        const floors = order.filter(function (f) { return technoFloors[f]; });
        host.innerHTML =
            '<button class="floor-btn" data-floor="all">전체</button>' +
            floors.map(function (f) {
                return '<button class="floor-btn" data-floor="' + f + '">' + f + '</button>';
            }).join('');
        host.querySelectorAll('.floor-btn').forEach(function (button) {
            button.onclick = function () {
                shownFloor = button.dataset.floor;
                applyFloorFilter();
                if (shownFloor !== 'all') flyToBuilding('techno');
            };
        });
    }

    function applyFloorFilter() {
        Object.keys(technoFloors).forEach(function (floor) {
            const on = (shownFloor === 'all' || shownFloor === floor);
            technoFloors[floor].forEach(function (entity) { entity.show = on; });
        });
        document.querySelectorAll('.floor-btn').forEach(function (button) {
            button.classList.toggle('active', button.dataset.floor === shownFloor);
        });
    }

    function rebuildHeights() {
        Object.keys(technoFloors).forEach(function (floor) {
            const base = floorBase(floor);
            technoFloors[floor].forEach(function (entity) {
                const isPlate = entity.polygon.extrudedHeight.getValue() -
                                entity.polygon.height.getValue() < 1.0;
                entity.polygon.height = base;
                entity.polygon.extrudedHeight = base + (isPlate ? 0.25 : SLAB_H);
            });
        });
    }

    document.getElementById('explode-toggle').onchange = function (event) {
        explode = event.target.checked;
        rebuildHeights();
    };

    buildTechno();

    // 메인 지도에서 테크노관을 보다가 넘어왔으면(#techno) 그 건물로 바로 간다.
    // 3D Tiles 로드가 끝난 뒤 zoomTo(tileset) 이 카메라를 가져가므로 그 뒤에 건다.
    if (location.hash === '#techno') {
        setTimeout(function () { window.flyToBuilding('techno'); }, 900);
    }

    // ── 건물 클릭 → 정보 표시 ──
    const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
    handler.setInputAction(function(click) {
        const picked = viewer.scene.pick(click.position);
        if (Cesium.defined(picked) && picked.primitive === tileset) {
            console.log('건물 클릭됨', picked);
            // TODO: 팝업 표시
        }
    }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

})();
</script>
</body>
</html>
