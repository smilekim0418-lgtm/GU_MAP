<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>캠퍼스맵 | 국립금오공과대학교</title>
  <meta name="description" content="국립금오공과대학교 양호동캠퍼스 건물·학과·편의시설 안내와 교내 도보 길찾기">
  <meta name="theme-color" content="#343b58">
  <link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/pretendard/pretendardvariable-dynamic-subset.css">
  <link rel="stylesheet" href="vendor/maplibre-gl/maplibre-gl.css">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/app.css">
  <script src="vendor/maplibre-gl/maplibre-gl.js" defer></script>
  <script src="vendor/techno-route-core.js" defer></script>
  <script type="module" src="assets/js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#search-input" data-i18n="skip.toSearch">검색으로 바로가기</a>
  <a class="skip-link" href="#building-list" data-i18n="skip.toList">건물 목록으로 바로가기</a>

  <header class="site-header" id="site-header">
    <div class="brand">
      <a class="brand-school" href="https://www.kumoh.ac.kr/" id="brand-link">
        <img class="brand-logo" id="brand-logo" src="assets/brand/logo.svg" alt="" hidden>
        <span data-i18n="brand.school">국립금오공과대학교</span>
      </a>
      <span class="brand-rule" aria-hidden="true"></span>
      <h1 class="brand-title" data-i18n="app.title">캠퍼스맵</h1>
      <span class="brand-campus" data-i18n="brand.campus">양호동캠퍼스</span>
    </div>
    <div class="header-actions">
      <button type="button" class="btn-text lang-toggle" id="lang-toggle"
              data-i18n="lang.switch" data-i18n-attr="aria-label:lang.switchLabel" lang="en">English</button>
    </div>
  </header>

  <main class="layout" id="layout">
    <aside class="panel" id="panel" data-sheet="half" aria-labelledby="panel-title">
      <h2 class="sr-only" id="panel-title" data-i18n="panel.title">캠퍼스 안내</h2>
      <div class="sheet-handle">
        <button type="button" class="sheet-grip" id="sheet-grip" aria-controls="panel"
                aria-expanded="true" data-i18n-attr="aria-label:sheet.collapse"></button>
      </div>

      <form class="search" id="search-form" role="search" autocomplete="off">
        <label class="search-label" for="search-input" data-i18n="search.label">건물, 학과, 편의시설, 호실 검색</label>
        <div class="search-field">
          <svg class="icon search-icon" aria-hidden="true"><use href="assets/icons/sprite.svg#search"></use></svg>
          <input type="search" id="search-input" name="q" enterkeyhint="search" spellcheck="false"
                 aria-describedby="search-hint" data-i18n-attr="placeholder:search.placeholder">
          <button type="button" class="icon-btn search-clear" id="search-clear" hidden
                  data-i18n-attr="aria-label:search.clear">
            <svg class="icon" aria-hidden="true"><use href="assets/icons/sprite.svg#close"></use></svg>
          </button>
        </div>
        <p class="sr-only" id="search-hint" data-i18n="search.noneHint"></p>
      </form>

      <div class="panel-body" id="panel-body">
        <div class="view" id="view-home"></div>
        <div class="view" id="view-results" hidden></div>
        <div class="view" id="view-detail" hidden></div>
        <div class="view" id="view-route" hidden></div>
      </div>

      <footer class="panel-footer" id="panel-footer"></footer>
    </aside>

    <section class="map-area" id="map-area" data-i18n-attr="aria-label:map.label">
      <div class="map" id="map"></div>
      <div class="map-fallback" id="map-fallback" hidden>
        <p data-i18n="map.noWebgl"></p>
      </div>
      <div class="indoor-bar" id="indoor-bar" hidden></div>
      <div class="floor-switcher" id="floor-switcher" hidden></div>
      <div class="map-controls" id="map-controls" role="group" data-i18n-attr="aria-label:map.label"></div>
      <div class="map-legend" id="map-legend"></div>
      <p class="map-attribution" data-i18n="map.attribution">지도 데이터 © OpenStreetMap contributors</p>
    </section>
  </main>

  <div class="sr-only" id="live" aria-live="polite" aria-atomic="true"></div>
  <div class="toast" id="toast" role="status" hidden></div>

  <noscript>
    <p class="noscript">이 페이지는 자바스크립트가 필요합니다. 학교 홈페이지의 캠퍼스 안내를 이용해 주세요.</p>
  </noscript>
</body>
</html>
